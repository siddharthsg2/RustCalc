[package]
name = "rustcalc-app"
description = "RustCalc application (egui GUI shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustcalc"
path = "src/main.rs"

[dependencies]
rustcalc-core = { path = "../rustcalc-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", features = ["persistence"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["persistence", "default_fonts", "glow", "android-native-activity"] }

[dev-dependencies]
egui_kittest = "0.37.0"

[build-dependencies]
winresource = "0.1.34"
