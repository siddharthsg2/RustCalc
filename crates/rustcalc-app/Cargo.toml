[package]
name = "rustcalc-app"
description = "RustCalc desktop application (egui GUI shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustcalc"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
rustcalc-core = { path = "../rustcalc-core" }

[dev-dependencies]
egui_kittest = "0.37.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
