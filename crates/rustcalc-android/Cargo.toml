[package]
name = "rustcalc-android"
description = "RustCalc Android entry point (cdylib)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
eframe = { version = "0.37", default-features = false, features = ["persistence", "default_fonts", "glow", "android-native-activity"] }
log = "0.4.34"
rustcalc-app = { version = "0.2.0", path = "../rustcalc-app" }
rustcalc-core = { version = "0.2.0", path = "../rustcalc-core" }
winit = { version = "0.30", default-features = false }

[package.metadata.android]
package = "com.siddharthsg.rustcalc"
apk_name = "rustcalc"
build_targets = [
    "armv7-linux-androideabi",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "RustCalc"
